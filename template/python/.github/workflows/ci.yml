# CI workflow for the Python flavour of {{TOOL_NAME}}.
#
# Placeholders (see SHARED PLACEHOLDER DICTIONARY in template/INSTANTIATE.md):
#   {{TOOL_NAME}} kebab-case CLI/binary/repo name, e.g. my-cli
#   {{TOOL_PKG}}  Python import package (underscores), e.g. my_cli
#                 The Python package directory uses underscores while the CLI
#                 binary / npm package use kebab-case. {{TOOL_PKG}} is the module
#                 path passed to `python -m` and the linted source directory.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ruff.toml excludes the vendored {{TOOL_PKG}}/_aicli/ (linted in the spec repository).
      - name: Lint with ruff
        run: ruff check {{TOOL_PKG}}/ tests/

      - name: Check formatting with ruff
        run: ruff format --check {{TOOL_PKG}}/ tests/

      # SEC-050: an audit per shipped ecosystem, fail-closed: the Python
      # dependencies (the vendored library needs only click) and the npm wrapper.
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Audit npm wrapper
        run: npm audit --audit-level=high --omit=optional

      # Includes the aicli conformance suite (VER-001: the write gate for every
      # write command, the contract on real output, reference budgets) and the
      # registry coverage check (VER-003). Every OS runs it: the gate's state
      # store behaves differently on Windows.
      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test (--help, reference --index)
        shell: bash
        run: |
          python -m {{TOOL_PKG}}.main --help
          python -m {{TOOL_PKG}}.main reference --index > /dev/null

  version-check:
    name: Verify version and spec sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Fail-closed: every derived version location must equal package.json.
      - name: Verify version sync
        run: node scripts/check-version.js

      # Fail-closed (REPO-SPEC, SEC-050): {{TOOL_PKG}}/_aicli must match its
      # MANIFEST.json (offline, strict), and every vendored spec file, schema and
      # library file must match the spec tag in .agent/SPEC_VERSION (remote; a
      # failed download degrades to a warning). Node only: there is no codegen.
      - name: Verify spec, contract and library sync
        run: node scripts/check-spec.js
