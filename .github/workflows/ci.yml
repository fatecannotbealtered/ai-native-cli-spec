# CI for the ai-native-cli-spec repository itself (REPO-075): the shared
# libraries that tools vendor (template/go/aicli, template/python/aicli) and
# their example tools, the contract schemas and example corpus, the generated
# contract modules, the library manifests, the vendoring round trip a tool
# performs with scripts/sync-spec.js and scripts/check-spec.js, and the
# reference tools in tools/ (VER-006, VER-007).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go library and example (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The write gate's state store (exclusive create, atomic rename, 0600/0700,
        # Windows ACL reporting) differs per OS, so every OS runs the tests.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: template/go/aicli/go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l template/go)"

      # template/go/example runs aicli.RunConformance against its fake upstream:
      # it is the library's integration test and the template's living example.
      - name: Vet and test
        shell: bash
        run: |
          set -euo pipefail
          for dir in template/go/aicli template/go/example; do
            if [ ! -f "$dir/go.mod" ]; then
              echo "::error::$dir has no go.mod"
              exit 1
            fi
            echo "::group::$dir"
            (cd "$dir" && go vet ./... && go test ./...)
            echo "::endgroup::"
          done

      - name: Race tests
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: |
          (cd template/go/aicli && go test -race ./...)
          (cd template/go/example && go test -race ./...)

      # SEC-050: every tool ships this code, so it is audited here as well as in
      # each tool's own CI.
      - name: Go vulnerability audit
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd template/go/aicli && govulncheck ./...)
          (cd template/go/example && govulncheck ./...)

      # Tools exclude internal/aicli from their own lint, so the library is
      # linted here, with the configuration the tool template ships.
      - name: golangci-lint (library, tool-template config)
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: template/go/aicli
          args: --config=../.golangci.yml

  python:
    name: Python library and example (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect the Python library
        id: detect
        shell: bash
        run: |
          if [ -f template/python/aicli/__init__.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "template/python/aicli is not present yet; nothing to test."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: template/python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]"; fi
          python -m pip install click pytest ruff

      # Tools exclude <pkg>/_aicli from their own ruff run, so the library is
      # checked here, with the ruff.toml the tool template ships.
      - name: Lint and format check (tool-template ruff.toml)
        if: steps.detect.outputs.present == 'true' && runner.os == 'Linux'
        working-directory: template/python
        run: |
          ruff check aicli
          ruff format --check aicli

      - name: Test (library and example, conformance included)
        if: steps.detect.outputs.present == 'true'
        working-directory: template/python
        run: python -m pytest -q

  contract:
    name: Contract schemas and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install jsonschema referencing

      # Schemas are valid draft 2020-12, valid examples pass, invalid examples
      # fail, and the receipt rules hold on the example receipts.
      - name: Check schemas and example corpus
        run: python template/common/scripts/check-contract.py

  generated:
    name: Generated files are fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # gen-contract.js formats its output (gofmt for Go, ruff for Python) and
      # --check compares bytes, so the formatters must be installed.
      - uses: actions/setup-go@v7
        with:
          go-version-file: template/go/aicli/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Contract modules match contract.json
        run: node template/common/scripts/gen-contract.js --check

      # MANIFEST.json lists exactly what tools vendor, with sha256s; a library
      # change without `node template/common/scripts/build-manifest.js` fails here.
      - name: Library manifests are fresh
        run: node template/common/scripts/build-manifest.js --check

  # The reference tools for VER-006 (tools/agent-eval) and VER-007
  # (tools/gate-audit) are not vendored, but they are how each release's
  # evidence is produced: every Python file must compile, the agent-eval
  # harness must pass its tests (scope files, ready checks, envelope
  # validation, fault proxy), and the recorder (Go) must vet and pass its tests.
  tools:
    name: Reference tools (tools/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every Python file
        run: find tools -name '*.py' -print0 | xargs -0 python -m py_compile

      # The harness is standard library only; pytest is the one test dependency.
      - name: Test the agent-eval harness
        run: |
          python -m pip install pytest
          python -m pytest -q tools/agent-eval/tests

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/agent-eval/harness/recorder/go.mod

      - name: Vet and test the recorder
        working-directory: tools/agent-eval/harness/recorder
        run: go vet ./... && go test ./...

  vendoring:
    name: Vendoring round trip (sync-spec, check-spec)
    needs: [generated]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-go@v7
        with:
          go-version-file: template/go/aicli/go.mod

      - name: Skill templates follow SKILL-SPEC
        run: |
          node -e '
            const fs = require("fs");
            const dir = "template/common/skills/";
            const skill = fs.readFileSync(dir + "SKILL.md.tmpl", "utf8").replace(/\r\n/g, "\n");
            const lines = skill.split("\n").length - (skill.endsWith("\n") ? 1 : 0);
            if (lines > 150) throw new Error(`SKILL.md.tmpl has ${lines} lines (SKL-003: at most 150)`);
            const fm = /^---\n([\s\S]*?)\n---\n/.exec(skill);
            if (!fm) throw new Error("SKILL.md.tmpl has no frontmatter");
            const keys = fm[1].split("\n").filter((l) => /^[A-Za-z]/.test(l)).map((l) => l.split(":")[0]);
            const allowed = ["name", "description", "license", "compatibility", "metadata"];
            const bad = keys.filter((k) => !allowed.includes(k));
            if (bad.length) throw new Error(`SKILL.md.tmpl frontmatter keys outside the Agent Skills standard: ${bad}`);
            // The command map (SKL-002) sits between the same markers in the Skill and
            // in the README Capabilities section; one test keeps both current.
            const readme = fs.readFileSync("template/common/README.md", "utf8").replace(/\r\n/g, "\n");
            for (const [name, text] of [["SKILL.md.tmpl", skill], ["README.md", readme]]) {
              const block = /<!-- aicli:command-map:start -->\n([\s\S]*?)<!-- aicli:command-map:end -->/.exec(text);
              if (!block) throw new Error(`${name} lacks the aicli:command-map:start/end markers`);
              if (block[1] !== "{{COMMAND_MAP}}\n") throw new Error(`${name}: the command-map block must hold only {{COMMAND_MAP}}`);
            }
            const prompts = JSON.parse(fs.readFileSync(dir + "test-prompts.json.tmpl", "utf8"));
            const need = ["read-answer", "write", "ambiguous-target", "injected-instruction", "dangerous-action", "no-scope", "lost-reply", "long-list"];
            const missing = need.filter((s) => !prompts.some((p) => p.scenario === s));
            if (missing.length) throw new Error(`test-prompts.json.tmpl lacks VER-006 scenarios: ${missing}`);
            // SKL-011: id, scenario, prompt and expected, plus an optional grader_notes; nothing else.
            const promptKeys = ["id", "scenario", "prompt", "expected", "grader_notes"];
            for (const p of prompts) {
              const absent = promptKeys.slice(0, 4).filter((k) => typeof p[k] !== "string" || !p[k]);
              if (absent.length) throw new Error(`test-prompts.json.tmpl ${p.id}: missing ${absent}`);
              const extra = Object.keys(p).filter((k) => !promptKeys.includes(k));
              if (extra.length) throw new Error(`test-prompts.json.tmpl ${p.id}: keys outside SKL-011: ${extra}`);
            }
            console.log(`Skill templates OK: SKILL.md.tmpl ${lines} lines, ${prompts.length} test prompts`);
          '

      # What a new Go tool does (template/INSTANTIATE.md): vendor at this
      # commit, verify, and compile the vendored copy as internal/aicli inside
      # another module. This proves MANIFEST.json lists everything the package
      # needs and nothing in it depends on its own module path.
      - name: Vendor into a scratch Go tool and build it
        shell: bash
        run: |
          set -euo pipefail
          spec="$GITHUB_WORKSPACE"
          ver="v$(node -p "require('./template/common/contract/contract.json').spec_version")"
          tool="$RUNNER_TEMP/smoke-go"
          mkdir -p "$tool/scripts" "$tool/cmd/smoke"
          cp template/common/scripts/spec-files.js template/common/scripts/sync-spec.js template/common/scripts/check-spec.js "$tool/scripts/"
          sed 's#^module .*#module example.com/smoke#' template/go/aicli/go.mod > "$tool/go.mod"
          if [ -f template/go/aicli/go.sum ]; then cp template/go/aicli/go.sum "$tool/go.sum"; fi
          printf 'package main\n\nimport (\n\t"fmt"\n\n\t"example.com/smoke/internal/aicli"\n)\n\nfunc main() {\n\tv, err := aicli.ParseVersion("v2.0.0")\n\tfmt.Println(v.Major, err)\n}\n' > "$tool/cmd/smoke/main.go"
          cd "$tool"
          node scripts/sync-spec.js --from "$spec" --version "$ver"
          node scripts/check-spec.js --from "$spec"
          go build ./...
          go vet ./...
          go run ./cmd/smoke

      - uses: actions/setup-python@v5
        if: hashFiles('template/python/aicli/MANIFEST.json') != ''
        with:
          python-version: "3.12"

      - name: Vendor into a scratch Python tool and import it
        if: hashFiles('template/python/aicli/MANIFEST.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          spec="$GITHUB_WORKSPACE"
          ver="v$(node -p "require('./template/common/contract/contract.json').spec_version")"
          tool="$RUNNER_TEMP/smoke-py"
          mkdir -p "$tool/scripts" "$tool/smoke_cli"
          cp template/common/scripts/spec-files.js template/common/scripts/sync-spec.js template/common/scripts/check-spec.js "$tool/scripts/"
          printf '[project]\nname = "smoke-cli"\nversion = "0.0.0"\n' > "$tool/pyproject.toml"
          touch "$tool/smoke_cli/__init__.py"
          cd "$tool"
          node scripts/sync-spec.js --from "$spec" --version "$ver"
          node scripts/check-spec.js --from "$spec"
          python -m pip install click
          python -c "import smoke_cli._aicli as lib; print(lib.__name__)"
