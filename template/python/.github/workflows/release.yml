# Release workflow for the Python flavour of {{TOOL_NAME}}.
#
# Triggered by a semver tag (v*.*.*). Runs the merge-path gates again (VER-008),
# then builds a single-file PyInstaller binary per OS/arch, merges per-platform
# checksums into one checksums.txt, signs it with Sigstore/Cosign keyless
# signing, attaches everything to a GitHub Release, then publishes the npm
# wrapper plus every platform package with npm provenance.
#
# Placeholders (see SHARED PLACEHOLDER DICTIONARY in template/INSTANTIATE.md):
#   {{TOOL_NAME}} kebab-case CLI/binary/repo name, e.g. my-cli
#   {{TOOL_PKG}}  Python import package (underscores), e.g. my_cli
name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege (SEC-050): every job reads only; the job that signs and
# publishes the GitHub release, and the npm publish (provenance), ask for more.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Preserve the five existing native targets; Windows ARM64 npm uses
        # the amd64 binary under x64 emulation and needs separate testing.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-2022]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # VER-008: the same gates as ci.yml before anything is built or signed.
      - name: Lint with ruff
        if: runner.os == 'Linux'
        run: |
          ruff check {{TOOL_PKG}}/ tests/
          ruff format --check {{TOOL_PKG}}/ tests/

      # Includes the aicli conformance suite (VER-001) and the coverage check (VER-003).
      - name: Test
        run: pytest tests/ -q

      # SEC-050: the release path gates on the same dependency audit the
      # merge path does. Without this, a CVE published after the last green run
      # on main ships: this job re-runs the tests at tag time but never asked
      # whether the code it is about to sign has a known vulnerability. A
      # release blocked by a fresh upstream advisory is the intended outcome.
      - name: Audit Python dependencies
        if: runner.os == 'Linux'
        run: pip-audit -r requirements.txt

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: "20"

      # The npm wrapper ships too: the same audit ci.yml (and the Go flavour)
      # runs on it.
      - name: Audit npm wrapper
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high --omit=optional

      # Checked before signing, so a mismatched tag never produces a GitHub
      # release that the npm publish job would then refuse.
      - name: Verify tag and version sync
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi
          node scripts/check-version.js

      # Refuse to publish a binary whose vendored specs, contract or
      # {{TOOL_PKG}}/_aicli library have drifted from the pinned spec tag. The
      # full check, as in ci.yml: a fetch that fails degrades to a warning; the
      # offline manifest check stays strict.
      - name: Verify spec, contract and library sync
        if: runner.os == 'Linux'
        run: node scripts/check-spec.js

      - name: Build binary
        run: python build.py

      # Every channel carries the Skills of its own version (REPO-043, SKL-009):
      # the archive ships skills/ beside the binary, as goreleaser does for the
      # Go flavour, and the binary update path syncs the Skills from there.
      - name: Package release archive
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $platformMap = @{
            "Linux" = "linux"
            "macOS" = "darwin"
            "Windows" = "windows"
          }
          $platform = $platformMap["${{ runner.os }}"]
          $arch = if ("${{ runner.arch }}" -eq "ARM64") { "arm64" } else { "amd64" }
          $base = "{{TOOL_NAME}}-$version-$platform-$arch"
          New-Item -ItemType Directory -Force -Path release, stage | Out-Null
          Copy-Item -Recurse -Force skills stage/skills
          if ("${{ runner.os }}" -eq "Windows") {
            Copy-Item dist/{{TOOL_NAME}}.exe stage/{{TOOL_NAME}}.exe
            Compress-Archive -Path stage/{{TOOL_NAME}}.exe, stage/skills -DestinationPath "release/$base.zip" -Force
            $hash = (Get-FileHash "release/$base.zip" -Algorithm SHA256).Hash.ToLower()
            "$hash  $base.zip" | Out-File -Encoding utf8 "release/checksums-$platform-$arch.txt"
          } else {
            Copy-Item dist/{{TOOL_NAME}} stage/{{TOOL_NAME}}
            tar -C stage -czf "release/$base.tar.gz" {{TOOL_NAME}} skills
            $hash = (Get-FileHash "release/$base.tar.gz" -Algorithm SHA256).Hash.ToLower()
            "$hash  $base.tar.gz" | Out-File -Encoding utf8 "release/checksums-$platform-$arch.txt"
          }

      - uses: actions/setup-node@v7
        if: runner.os != 'Linux'
        with:
          node-version: '20'

      - name: Install actual archive and run product smoke
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $platform = @{ Linux = 'linux'; macOS = 'darwin'; Windows = 'windows' }['${{ runner.os }}']
          $arch = if ('${{ runner.arch }}' -eq 'ARM64') { 'arm64' } else { 'amd64' }
          $ext = if ($platform -eq 'windows') { 'zip' } else { 'tar.gz' }
          $archive = "release/{{TOOL_NAME}}-$version-$platform-$arch.$ext"
          $install = Join-Path $env:RUNNER_TEMP 'package-install'
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          tar -xf $archive -C $install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaryName = if ($platform -eq 'windows') { '{{TOOL_NAME}}.exe' } else { '{{TOOL_NAME}}' }
          node scripts/check-platform-delivery.js smoke $archive (Join-Path $install $binaryName) $platform $arch "release/smoke-$platform-$arch.json" scripts/smoke-product.js '{{TOOL_NAME}}' $version --expected-source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain actual smoke result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "smoke-evidence-${{ matrix.os }}"
          path: release/smoke-*.json
          if-no-files-found: warn

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "{{TOOL_NAME}}-${{ matrix.os }}"
          path: |
            release/*.tar.gz
            release/*.zip
            release/checksums-*.txt

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    # The only job that writes: it signs checksums.txt keylessly (id-token) and
    # creates the GitHub release (contents).
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-dist

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release smoke-records
          find release-dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          find release-dist -type f -name "checksums-*.txt" -exec cat {} \; > release/checksums.txt
          while IFS= read -r -d '' file; do
            target="smoke-records/$(basename "$file")"
            if [ -e "$target" ]; then echo "Duplicate smoke record: $target" >&2; exit 1; fi
            cp -- "$file" "$target"
          done < <(find release-dist -type f -name 'smoke-*.json' -print0)
          test -s release/checksums.txt
          VERSION=$(node -p "require('./package.json').version")
          node scripts/check-platform-delivery.js check release smoke-records '{{TOOL_NAME}}' "$VERSION" --expected-source-sha "$GITHUB_SHA"
          (cd release && sha256sum --check checksums.txt)

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums
        shell: bash
        run: cosign sign-blob --new-bundle-format --bundle release/checksums.txt.sigstore.json release/checksums.txt --yes

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Slice the '## [VERSION]' section out of CHANGELOG.md for this tag (awk: portable).
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Defensive fallback: if the slice is empty, point at the changelog.
          if [ ! -s release-notes.md ]; then
            printf '## v%s\n\nSee [CHANGELOG.md](CHANGELOG.md) for details.\n' "$VERSION" > release-notes.md
          fi

      # A tag with a semver prerelease part (v2.1.0-rc.1) is a GitHub prerelease;
      # update never installs one unless asked with --target-version (CLI-070).
      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          always-auth: true

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi
          # Extend the guard to every derived location (SKILL.md, __version__,
          # lockfile pins, optionalDependencies, CHANGELOG), not just package.json.
          node scripts/check-version.js

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist signed
          gh release download "${GITHUB_REF_NAME}" --dir dist --pattern "*.tar.gz" --pattern "*.zip"
          gh release download "${GITHUB_REF_NAME}" --dir signed \
            --pattern "checksums.txt" --pattern "checksums.txt.sigstore.json"
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) -print

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # The archives are repackaged for npm only after checksums.txt verifies
      # against its Sigstore bundle with the exact identity update checks
      # (CLI-070 item 4), and every archive against checksums.txt.
      - name: Verify the signed checksums and the archives
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle signed/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            signed/checksums.txt
          tr -d '\r' < signed/checksums.txt > dist/checksums.txt
          (cd dist && sha256sum --check --strict --ignore-missing checksums.txt)
          for f in dist/*.tar.gz dist/*.zip; do
            [ -e "$f" ] || continue
            grep -q "  $(basename "$f")\$" dist/checksums.txt || { echo "::error::$f is not in checksums.txt"; exit 1; }
          done
          rm dist/checksums.txt

      - name: Prepare npm platform packages
        run: node scripts/prepare-npm-platform-packages.js dist npm-platform

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ROOT_PKG=$(node -p "require('./package.json').name")
          # A prerelease (a version with "-") goes to the next dist-tag, so
          # `npm install -g` keeps resolving the latest release.
          TAG_ARGS=()
          case "$VERSION" in *-*) TAG_ARGS=(--tag next) ;; esac

          for dir in npm-platform/*; do
            [ -d "$dir" ] || continue
            PKG=$(node -p "require('./${dir}/package.json').name")
            if npm view "${PKG}@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
              echo "npm package ${PKG}@${VERSION} already published; skipping"
              continue
            fi
            npm publish "./$dir" --access public --provenance "${TAG_ARGS[@]}"
          done

          if npm view "${ROOT_PKG}@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
            echo "npm package ${ROOT_PKG}@${VERSION} already published; skipping"
            exit 0
          fi
          # Keep platform pins in lockstep with the package version (single
          # source of truth): rewrite optionalDependencies to the published
          # version so an npm install never resolves a stale platform binary.
          node -e "const fs=require('fs'),p=require('./package.json');for(const k in (p.optionalDependencies||{}))p.optionalDependencies[k]=p.version;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+String.fromCharCode(10))"
          npm publish --access public --provenance "${TAG_ARGS[@]}"
