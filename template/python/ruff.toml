# Committed ruff config for the Python flavour of {{TOOL_NAME}}.
#
# REPO-SPEC requires the formatter config to live in the repo (not only in CI
# defaults) so local `ruff check` / `ruff format` match what CI enforces.
# ruff is used for both linting and formatting; no separate black/isort needed.

line-length = 100
target-version = "py310"

# {{TOOL_PKG}}/_aicli/ is the vendored ai-native-cli-spec library. It is linted
# and tested in the spec repository, guarded by scripts/check-spec.js, and never
# edited here, so neither lint nor format runs on it. force-exclude keeps it
# excluded when a hook passes its files explicitly.
extend-exclude = ["_aicli"]
force-exclude = true

[lint]
# E/F: pycodestyle + pyflakes (core correctness + style)
# I:   import sorting (isort)
# UP:  pyupgrade — keep syntax modern for the target version
# B:   flake8-bugbear — catch likely bugs and footguns
select = ["E", "F", "I", "UP", "B"]

[format]
# Defaults: double quotes, space indentation, auto line endings.
quote-style = "double"
indent-style = "space"
