# pytest configuration for the notes example on its own:
#   cd template/python/example && python -m pytest
# Spec CI runs `python -m pytest -q` from template/python, which collects these
# tests and the library's; tests/conftest.py puts the library and the example
# package on sys.path either way.
[pytest]
addopts = -p no:cacheprovider
testpaths = tests
markers =
    slow: spawns processes
