# CI workflow for the Python flavour of {{TOOL_NAME}}.
#
# Placeholders (see SHARED PLACEHOLDER DICTIONARY):
#   {{TOOL_NAME}} kebab-case CLI/binary/repo name, e.g. my-cli
#   {{TOOL_PKG}}  Python import package (underscores), e.g. my_cli
#                 The Python package directory uses underscores while the CLI
#                 binary / npm package use kebab-case. {{TOOL_PKG}} is the module
#                 path passed to `python -m` and the linted source directory.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check {{TOOL_PKG}}/ tests/

      - name: Check formatting with ruff
        run: ruff format --check {{TOOL_PKG}}/ tests/

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Audit npm wrapper
        run: npm audit --omit=dev

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test (--help)
        run: python -m {{TOOL_PKG}}.main --help

  version-check:
    name: Verify version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # gen-contract.js pipes the generated Python through `ruff format`, and
      # falls back to unformatted output when ruff is missing. Without ruff on
      # PATH the step below would regenerate a differently-formatted
      # contract_gen.py and report drift against the correctly-formatted
      # committed one. The codegen verifier needs the codegen's own toolchain.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (required by the contract codegen)
        run: python -m pip install --upgrade pip && pip install ruff

      # Fail-closed: every derived version location must equal package.json.
      - name: Verify version sync
        run: node scripts/check-version.js

      # Fail-closed: the vendored spec assets must match the pinned tag, and the
      # generated contract module must match contract.json (REPO-SPEC §5c).
      - name: Verify spec/contract sync
        run: node scripts/check-spec.js
