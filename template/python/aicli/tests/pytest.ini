# pytest configuration for running the aicli library tests on their own:
#   cd template/python/aicli/tests && python -m pytest
# Spec CI runs `python -m pytest -q` from template/python, which collects these
# tests and the example's; conftest.py puts the library on sys.path either way.
# This file is not vendored into tools (tests/ is excluded from MANIFEST.json).
[pytest]
addopts = -p no:cacheprovider
testpaths = .
markers =
    slow: spawns processes
