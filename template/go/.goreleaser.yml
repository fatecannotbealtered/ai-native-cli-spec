version: 2

project_name: {{TOOL_NAME}}

before:
  hooks:
    - go mod tidy

builds:
  - main: {{CMD_PATH}}
    binary: {{TOOL_NAME}}
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X {{MODULE}}/cmd.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Preserve the existing five native targets. Windows ARM64 npm installs
    # use the Windows amd64 binary under x64 emulation, not a native build.
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    wrap_in_directory: false
    # Every channel carries the Skills of its own version (REPO-043, SKL-009):
    # the archive ships skills/ beside the binary, and the binary update path
    # syncs the Skills from there.
    files:
      - skills/**/*
      - LICENSE
      - licenses/**/*

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--new-bundle-format"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

release:
  # Published versions are immutable; do not replace existing artifacts.
  replace_existing_artifacts: false
  # A semver prerelease tag (v2.1.0-rc.1) is published as a GitHub prerelease, so
  # it is never the latest release; `update` installs one only with
  # --target-version (CLI-070).
  prerelease: auto
